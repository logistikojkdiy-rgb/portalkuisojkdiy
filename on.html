<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Portal Kuis - OJK DIY</title>
    
    <!-- Preload Assets & Fonts -->
    <link rel="icon" type="image/png" href="https://ik.imagekit.io/logojkdiy/ojk-indonesia-seeklogo.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        ojk: { DEFAULT: '#8B0000', 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 900: '#7f1d1d' },
                        surface: { DEFAULT: '#ffffff', dark: '#0f172a' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-out forwards',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slide-down': 'slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(40px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        slideDown: { '0%': { opacity: '0', transform: 'translateY(-40px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                        shake: { '10%, 90%': { transform: 'translate3d(-2px, 0, 0)' }, '20%, 80%': { transform: 'translate3d(4px, 0, 0)' }, '30%, 50%, 70%': { transform: 'translate3d(-6px, 0, 0)' }, '40%, 60%': { transform: 'translate3d(6px, 0, 0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0f172a; color: #1e293b; overflow: hidden; }
        
        /* Premium Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.8);
        }

        .modal-glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Modern Floating Input */
        .input-floating { position: relative; width: 100%; margin-bottom: 1.25rem; }
        .input-floating input {
            width: 100%; background-color: #f8fafc; border: 2px solid #e2e8f0; border-radius: 1.25rem;
            padding: 1.75rem 1.25rem 0.5rem 1.25rem; font-size: 1rem; font-weight: 700; color: #1e293b;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-floating input:focus { outline: none; background-color: #ffffff; border-color: #8B0000; box-shadow: 0 0 0 4px rgba(139, 0, 0, 0.1); }
        .input-floating label {
            position: absolute; left: 1.25rem; top: 1.25rem; color: #94a3b8; font-size: 1rem;
            font-weight: 600; pointer-events: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-floating input:focus ~ label, .input-floating input:not(:placeholder-shown) ~ label {
            top: 0.45rem; font-size: 0.75rem; font-weight: 800; color: #8B0000;
        }

        /* Iframe & Buttons Architecture */
        .iframe-container {
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s;
        }
        .action-card {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .action-card:active { transform: scale(0.97); }
    </style>
</head>
<body class="min-h-screen relative flex items-center justify-center selection:bg-ojk-50 selection:text-ojk-900 font-sans">

    <!-- ========================================== -->
    <!-- AMBIENT BACKGROUND                         -->
    <!-- ========================================== -->
    <div class="fixed inset-0 -z-20 w-full h-full bg-slate-900">
        <video src="https://ik.imagekit.io/logojkdiy/Background%20Biru%20Abu%20Putih.mp4" autoplay loop muted playsinline class="w-full h-full object-cover opacity-70"></video>
    </div>
    <div class="fixed inset-0 -z-10 bg-gradient-to-b from-slate-900/30 via-slate-900/60 to-slate-900/95 backdrop-blur-[8px]"></div>

    <!-- ========================================== -->
    <!-- 1. MAIN SPLASH CONTAINER                   -->
    <!-- ========================================== -->
    <div id="screen-main" class="relative z-10 w-full max-w-[1000px] px-4 flex flex-col items-center justify-center opacity-0 animate-slide-up transition-all duration-500 origin-bottom">
        
        <div class="w-full max-w-lg glass-panel rounded-[3rem] p-8 sm:p-12 text-center relative overflow-hidden">
            <!-- Decorative Ambient Blurs -->
            <div class="absolute -top-24 -right-24 w-72 h-72 bg-ojk-50 rounded-full blur-[70px] opacity-60 pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-72 h-72 bg-blue-50 rounded-full blur-[70px] opacity-60 pointer-events-none"></div>

            <div class="relative z-10">
                <!-- Status Badge -->
                <div class="inline-flex items-center gap-2.5 bg-white/60 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/60 w-max mb-8 shadow-sm">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                    </span>
                    <span class="text-[10px] font-extrabold tracking-widest uppercase text-slate-700">Akses Internal</span>
                </div>

                <img src="https://ik.imagekit.io/logojkdiy/ojk-indonesia-seeklogo.png" alt="OJK DIY" class="h-16 sm:h-20 object-contain mx-auto mb-6 animate-float drop-shadow-lg">
                
                <h1 class="text-3xl sm:text-4xl font-black text-slate-900 tracking-tight mb-3">Portal Kuis</h1>
                <p class="text-slate-500 text-sm sm:text-base font-medium leading-relaxed mb-10 max-w-[320px] mx-auto">Silakan pilih akses Anda.</p>

                <!-- Action Routing Buttons -->
                <div class="flex flex-col gap-4">
                    
                    <!-- BUTTON 1: TO QUIZ (IFRAME) -->
                    <button onclick="loadApp(URL_QUIZ)" 
                       class="action-card group w-full flex justify-between items-center px-6 py-5 rounded-[1.5rem] text-white bg-gradient-to-r from-slate-900 to-slate-800 hover:from-ojk hover:to-ojk-900 shadow-[0_15px_30px_-10px_rgba(0,0,0,0.4)] hover:shadow-[0_20px_40px_-10px_rgba(139,0,0,0.5)] border border-slate-700/50 hover:border-ojk-600/50">
                        <div class="flex items-center gap-5">
                            <div class="w-12 h-12 rounded-[1rem] bg-white/10 flex items-center justify-center border border-white/10 group-hover:bg-white/20 transition-colors">
                                <span class="material-symbols-outlined text-white">edit_document</span>
                            </div>
                            <div class="text-left">
                                <p class="text-[15px] font-extrabold tracking-wide mb-0.5">Akses Kuis Internal</p>
                                <p class="text-[11px] font-medium text-white/60">Kuis Internal Pegawai OJK DIY</p>
                            </div>
                        </div>
                        <span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1.5 opacity-70 group-hover:opacity-100">arrow_forward_ios</span>
                    </button>

                    <!-- BUTTON 2: TO DASHBOARD (AUTH MODAL -> IFRAME) -->
                    <button onclick="openAuthModal()" 
                            class="action-card group w-full flex justify-between items-center px-6 py-5 rounded-[1.5rem] text-slate-700 bg-white/90 backdrop-blur-sm border-2 border-slate-100 hover:border-slate-300 hover:bg-white shadow-sm hover:shadow-md">
                        <div class="flex items-center gap-5">
                            <div class="w-12 h-12 rounded-[1rem] bg-slate-50 flex items-center justify-center border border-slate-200 group-hover:bg-slate-100 transition-colors">
                                <span class="material-symbols-outlined text-slate-500">monitoring</span>
                            </div>
                            <div class="text-left">
                                <p class="text-[15px] font-extrabold tracking-wide mb-0.5">Dasbor Peringkat</p>
                                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Masuk dengan Sandi</p>
                            </div>
                        </div>
                        <span class="material-symbols-outlined text-slate-300 transition-colors duration-300 group-hover:text-slate-600">lock</span>
                    </button>
                </div>
            </div>
            
            <!-- Footer Stamp -->
            <div class="mt-12 pt-6 border-t border-slate-200/50 relative z-10">
                <p class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-[14px]">shield_lock</span> Otoritas Jasa Keuangan &bull; DIY
                </p>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. FRAMELESS IFRAME APP SHELL              -->
    <!-- ========================================== -->
    <div id="screen-iframe" class="fixed inset-0 z-[60] iframe-container invisible opacity-0 flex flex-col bg-slate-900/50 backdrop-blur-md">
        
        <!-- Floating Close Button (Overlays the Iframe seamlessly) -->
        <button onclick="closeApp()" class="fixed top-4 right-4 sm:top-6 sm:right-6 z-[70] group flex items-center gap-2 bg-slate-900/60 backdrop-blur-lg hover:bg-red-500/90 border border-white/20 text-white px-4 py-2 sm:px-5 sm:py-2.5 rounded-full transition-all duration-300 text-sm font-bold shadow-2xl active:scale-95">
            <span class="material-symbols-outlined text-[20px] group-hover:rotate-90 transition-transform duration-300">close</span>
            <span class="hidden sm:inline">Tutup Sesi</span>
        </button>

        <!-- Seamless Edge-to-Edge Iframe Wrapper -->
        <div class="relative flex-1 w-full h-full bg-transparent overflow-hidden">
            
            <!-- Elegant Latency Loader -->
            <div id="iframe-loader" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-50 transition-opacity duration-500">
                <div class="relative flex items-center justify-center w-24 h-24 mb-6">
                    <div class="absolute inset-0 border-4 border-slate-200 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-ojk rounded-full border-t-transparent animate-spin"></div>
                    <span class="material-symbols-outlined text-3xl text-ojk animate-pulse-slow">cloud_sync</span>
                </div>
                <h3 class="text-slate-800 text-xl font-extrabold mb-2 tracking-tight">Menyiapkan Ruang Kerja</h3>
                <p class="text-slate-500 font-medium text-sm animate-pulse">Melakukan inisiasi koneksi...</p>
            </div>

            <!-- The Web App Iframe -->
            <iframe id="app-frame" class="w-full h-full border-0 relative z-10 opacity-0 transition-opacity duration-700 bg-transparent"></iframe>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. AUTHENTICATION MODAL (DASHBOARD)        -->
    <!-- ========================================== -->
    <div id="auth-modal" class="fixed inset-0 z-[80] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <!-- Blur Backdrop -->
        <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-md" onclick="closeAuthModal()"></div>
        
        <!-- Modal Content Card -->
        <div class="modal-glass w-full max-w-sm rounded-[2.5rem] p-8 relative z-10 transform scale-95 transition-transform duration-300 shadow-[0_30px_60px_-15px_rgba(0,0,0,0.8)]" id="auth-card">
            
            <!-- Close Button -->
            <button onclick="closeAuthModal()" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100/80 text-slate-500 hover:bg-red-50 hover:text-red-600 transition-colors">
                <span class="material-symbols-outlined text-[18px]">close</span>
            </button>

            <!-- Header -->
            <div class="text-center mb-8 pt-2">
                <div class="w-16 h-16 bg-slate-900 text-white rounded-[1.5rem] flex items-center justify-center text-3xl mx-auto mb-5 shadow-[0_10px_20px_rgba(0,0,0,0.3)] transform rotate-3">
                    <span class="material-symbols-outlined text-4xl">admin_panel_settings</span>
                </div>
                <h2 class="text-2xl font-black text-slate-900 tracking-tight">Otorisasi Sistem</h2>
                <p class="text-slate-500 mt-2 text-xs font-medium leading-relaxed">Masukkan kredensial khusus administrator.</p>
            </div>

            <!-- Form -->
            <form onsubmit="handleAdminLogin(event)">
                <div class="input-floating group">
                    <input type="text" id="admin-user" placeholder=" " required autocomplete="off" class="group-hover:border-slate-300">
                    <label for="admin-user">Username</label>
                </div>
                <div class="input-floating group">
                    <input type="password" id="admin-pass" placeholder=" " required autocomplete="off" class="group-hover:border-slate-300">
                    <label for="admin-pass">Kata Sandi</label>
                </div>

                <!-- Error Placeholder -->
                <p id="auth-error" class="text-[11px] font-extrabold text-red-500 text-center mb-4 hidden tracking-wide bg-red-50 py-2 rounded-lg border border-red-100"></p>

                <!-- Submit Button -->
                <button type="submit" id="btn-auth" class="w-full flex justify-center items-center gap-2 py-4 rounded-[1.25rem] text-sm font-bold text-white bg-slate-900 hover:bg-black transition-all duration-300 shadow-[0_10px_20px_-10px_rgba(0,0,0,0.5)] active:scale-[0.98]">
                    <span id="txt-auth">Buka Dasbor Peringkat</span>
                    <span class="material-symbols-outlined hidden animate-spin" id="ldr-auth">progress_activity</span>
                </button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT ENGINE                          -->
    <!-- ========================================== -->
    <script>
        // URLs Konfigurasi GAS
        const URL_QUIZ = "https://script.google.com/macros/s/AKfycbz756NYyexqK4c6QlSr5pgyCbNPx3obtpuXB_Exr0WP1bHEC5z1c8lxmEmhFA65oB_AKg/exec";
        const URL_DASHBOARD = "https://script.google.com/macros/s/AKfycbz756NYyexqK4c6QlSr5pgyCbNPx3obtpuXB_Exr0WP1bHEC5z1c8lxmEmhFA65oB_AKg/exec?page=dashboard";

        // DOM Elements
        const screenMain = document.getElementById('screen-main');
        const screenIframe = document.getElementById('screen-iframe');
        const iframeEl = document.getElementById('app-frame');
        const loaderEl = document.getElementById('iframe-loader');
        
        const modal = document.getElementById('auth-modal');
        const card = document.getElementById('auth-card');
        const errorText = document.getElementById('auth-error');

        // ----------------------------------------
        // FRAMELESS IFRAME LOGIC
        // ----------------------------------------
        function loadApp(url) {
            // Sembunyikan Splash
            screenMain.classList.add('opacity-0', 'scale-95');
            screenMain.style.pointerEvents = 'none'; 
            
            // Munculkan Container
            screenIframe.classList.remove('invisible', 'opacity-0');
            
            // Reset loader
            loaderEl.classList.remove('opacity-0', 'hidden');
            iframeEl.classList.add('opacity-0');
            
            // Tembak URL
            iframeEl.src = url;

            // Tunggu selesai muat
            iframeEl.onload = function() {
                loaderEl.classList.add('opacity-0');
                setTimeout(() => loaderEl.classList.add('hidden'), 500);
                iframeEl.classList.remove('opacity-0');
            };
        }

        function closeApp() {
            // Matikan tampilan iframe
            screenIframe.classList.add('opacity-0');
            
            setTimeout(() => {
                screenIframe.classList.add('invisible');
                iframeEl.src = ''; // Clear RAM browser
                
                // Panggil Splash kembali
                screenMain.classList.remove('opacity-0', 'scale-95');
                screenMain.style.pointerEvents = 'auto';
            }, 500);
        }

        // ----------------------------------------
        // MODAL AUTHENTICATION LOGIC
        // ----------------------------------------
        function openAuthModal() {
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
            setTimeout(() => document.getElementById('admin-user').focus(), 100);
        }

        function closeAuthModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            
            errorText.classList.add('hidden');
            document.getElementById('admin-user').value = '';
            document.getElementById('admin-pass').value = '';
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value.trim();
            const btn = document.getElementById('btn-auth');
            
            btn.disabled = true;
            document.getElementById('txt-auth').textContent = "Memverifikasi...";
            document.getElementById('ldr-auth').classList.remove('hidden');
            errorText.classList.add('hidden');

            setTimeout(() => {
                if (user === 'LMSt' && pass === '1234') {
                    document.getElementById('txt-auth').textContent = "Akses Diterima";
                    
                    setTimeout(() => {
                        closeAuthModal(); 
                        loadApp(URL_DASHBOARD);
                        
                        setTimeout(() => {
                            btn.disabled = false;
                            document.getElementById('txt-auth').textContent = "Buka Dasbor Peringkat";
                            document.getElementById('ldr-auth').classList.add('hidden');
                        }, 500);
                    }, 400);

                } else {
                    btn.disabled = false;
                    document.getElementById('txt-auth').textContent = "Buka Dasbor Peringkat";
                    document.getElementById('ldr-auth').classList.add('hidden');
                    
                    errorText.innerHTML = "<span class='material-symbols-outlined text-[14px] align-middle mr-1'>error</span> Kredensial tidak valid.";
                    errorText.classList.remove('hidden');
                    
                    card.classList.remove('animate-shake');
                    void card.offsetWidth; 
                    card.classList.add('animate-shake');
                    
                    document.getElementById('admin-pass').value = '';
                    document.getElementById('admin-pass').focus();
                }
            }, 800);
        }

        // Shortcut
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                if (!modal.classList.contains('opacity-0')) {
                    closeAuthModal();
                } else if (!screenIframe.classList.contains('invisible')) {
                    closeApp();
                }
            }
        });
    </script>
</body>
</html>
